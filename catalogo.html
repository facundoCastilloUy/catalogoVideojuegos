<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="icon" href="../icons/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/estilos.css">
    <title>Mood Atlas | Catálogo</title>
</head>

<body>

  <nav>
    <a href="index.html" id="logo" class="brand-logo" aria-label="Mood Atlas">
      <img src="../icons/mood-atlas-mark.svg" alt="" class="brand-mark">
      <span class="brand-copy">
        <span class="brand-name">Mood Atlas</span>
        <span class="brand-tagline">Map your next game</span>
      </span>
    </a>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="catalogo.html">Catálogo</a></li>
      <li><a href="sugerencias.html">Sugerencias</a></li>
    </ul>
  </nav>

    <main id="pagina-catalogo">
        <section id="busqueda-contenedor">
            <div class="busqueda-botones">
                <button id="btn-toggle-filtros" type="button" aria-expanded="false" aria-controls="sidebar">
                    <span class="material-symbols-rounded" aria-hidden="true">tune</span>
                    <span>Filtros avanzados</span>
                </button>
            </div>
            <input type="text" id="buscador" placeholder="Buscar por nombre">
            <p id="busqueda-cantidad"></p>
            <select id="ordenar" aria-label="Ordenar resultados">
                <option value="" disabled selected>Ordenar por</option>
                <option value="default">Por defecto</option>
                <option value="favoritos">Favoritos</option>
                <option value="mas-votado">Más votado</option>
                <option value="menos-votado">Menos votado</option>
                <option value="nombre-a-z">Nombre A-Z</option>
                <option value="nombre-z-a">Nombre Z-A</option>
            </select>
        </section>

        <aside id="sidebar">
            <h2>Filtros avanzados</h2>
            <button id="btn-limpiar-filtros">Limpiar filtros</button>
            <h3>Estado de ánimo</h3>
            <label><input type="radio" name="estadoAnimo" value="todos" class="filtro-estado" checked> Todos</label>
            <label><input type="radio" name="estadoAnimo" value="Relajado" class="filtro-estado"> Relajado</label>
            <label><input type="radio" name="estadoAnimo" value="Emocional" class="filtro-estado"> Emocional</label>
            <label><input type="radio" name="estadoAnimo" value="Desafiante" class="filtro-estado"> Desafiante</label>
            <h3>Duración</h3>
            <label><input type="radio" name="duracion" value="todas" class="filtro-duracion" checked> Todas</label>
            <label><input type="radio" name="duracion" value="Corta" class="filtro-duracion"> Corta</label>
            <label><input type="radio" name="duracion" value="Media" class="filtro-duracion"> Media</label>
            <label><input type="radio" name="duracion" value="Larga" class="filtro-duracion"> Larga</label>
            <h3>Género</h3>
            <label><input type="radio" name="genero" value="todos" class="filtro-genero" checked> Todos</label>
            <label><input type="radio" name="genero" value="Aventura" class="filtro-genero"> Aventura</label>
            <label><input type="radio" name="genero" value="Puzzle" class="filtro-genero"> Puzzle</label>
            <label><input type="radio" name="genero" value="Acción" class="filtro-genero"> Acción</label>
            <hr></br>
            <label><input type="checkbox" name="filtro-año-actual" id="filtro-año-actual">Solo juegos lanzados este
                año</label>
        </aside>

        <section id="catalogo-contenedor"></section>

    </main>

    <footer>
        <div class="creditos">
            <p>&copy; 2025 | PW Obligatorio 1 | Mood Atlas</p>
            <p>Desarrollado por Facundo Castillo · N° de estudiante: 159990</p>
            <p><a href="mailto:facundohcastillo@gmail.com">Contacto</a></p>
        </div>
    </footer>

<script src="../js/data.js"></script>
<script src="../js/helpers.js"></script>
<script src="../js/catalogo.js"></script>
</body>

</html>
