<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/estilos.css">nk
    <title>Sugerí un videojuego</title>
</head>
<body>
    <section id="contacto" class="contenedor">
  <h2>Sugerí un videojuego</h2>
  <p>¿Conocés un juego que debería estar en nuestro catálogo? Completá el siguiente formulario:</p>

  <form id="form-sugerencia" action="#" method="post">
    <label for="nombre">Tu nombre:</label>
    <input type="text" id="nombre" name="nombre" required />

    <label for="email">Tu email:</label>
    <input type="email" id="email" name="email" required />

    <label for="titulo">Título del juego:</label>
    <input type="text" id="titulo" name="titulo" required />

    <label for="plataforma">¿Dónde se juega?</label>
    <input type="text" id="plataforma" name="plataforma" placeholder="Steam, PlayStation, PC, etc." />

    <label for="descripcion">¿Por qué debería estar en el catálogo?</label>
    <textarea id="descripcion" name="descripcion" rows="5"></textarea>

    <button type="submit">Enviar sugerencia</button>
  </form>
</section>

    <script src="../js/data_completo.js"></script>
    
</body>
</html>
